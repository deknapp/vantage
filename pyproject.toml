[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage-gh"
version = "0.1.0"
description = "See who is looking at your GitHub repos, from the terminal or a local dashboard."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nathaniel Knapp" }]
keywords = ["github", "traffic", "analytics", "cli", "portfolio", "gh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []   # stdlib only, by design

[project.urls]
Homepage = "https://github.com/deknapp/vantage"
Issues = "https://github.com/deknapp/vantage/issues"

[project.scripts]
vantage = "vantage.cli:main"

[tool.setuptools.packages.find]
include = ["vantage*"]
